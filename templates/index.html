<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📂 File Share</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      padding: 2rem;
      max-width: 700px;
      margin: auto;
    }
    h1 {
      text-align: center;
    }
    .upload-box {
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .file-list {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .file-item {
      margin-bottom: 0.5rem;
    }
    progress {
      width: 100%;
      margin-top: 0.5rem;
    }
    .qr {
      margin-top: 2rem;
      text-align: center;
    }
    input[type="file"] {
      display: block;
      margin-bottom: 0.5rem;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>📂 File Share</h1>

  <div class="upload-box">
    <h3>Upload a File</h3>
    <<form id="upload-form">
        <input type="file" id="file-input" required />
        <button type="submit">Upload</button>
        <progress value="0" max="100" id="progress-bar" style="display:none;"></progress>
      </form>
    <div id="upload-status"></div>
  </div>

  <div class="file-list">
    <h3>Available Files</h3>
    {% if files %}
      <ul>
        {% for file in files %}
          <li class="file-item">
            <a href="/download/{{ file }}">{{ file }}</a>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No files uploaded yet.</p>
    {% endif %}
  </div>

  <div class="qr">
    <h3>📱 Open on Mobile</h3>
    <p>Scan the QR code to open this page:</p>
    <img src="/qrcode" alt="QR Code" width="200">
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const progressBar = document.getElementById('progress-bar');
    const status = document.getElementById('upload-status');
  
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = document.getElementById('file-input').files[0];
      if (!file) return;
  
      const chunkSize = 1024 * 1024; // 1MB
      const totalChunks = Math.ceil(file.size / chunkSize);
      const filename = file.name;
      const promises = [];
  
      progressBar.style.display = 'block';
      progressBar.value = 0;
  
      for (let i = 0; i < totalChunks; i++) {
        const chunk = file.slice(i * chunkSize, (i + 1) * chunkSize);
        const formData = new FormData();
        formData.append('chunk', chunk);
        formData.append('filename', filename);
        formData.append('chunk_index', i);
        formData.append('total_chunks', totalChunks);
  
        const req = fetch('/upload_chunk', {
          method: 'POST',
          body: formData
        }).then(() => {
          progressBar.value = ((i + 1) / totalChunks) * 100;
        });
  
        promises.push(req);
      }
  
      await Promise.all(promises);
      status.innerHTML = "✅ Upload complete. <a href='/'>Refresh</a>";
      progressBar.value = 0;
    });
  </script>
</body>
</html>
